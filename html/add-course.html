<body>

        <a href="../index.html">Home</a>

        <a href="add-course.html">Add Course</a>
        <a href="contact.html">Contact Us</a>
      </div>
    </nav>
  </header>

  <main>
    <section>
      <h2>Add A New Course</h2>
      <P>Fill in the course information below.</P>
      <form>
        <label>Course Name</label>
        <input type="text" placeholder="Enter course name"><br><br>
        <label>Lecturer Name</label>
        <input type="text" placeholder="Enter lecturer name"><br><br>
        <label>Credit Hours</label>
        <input type="number" min="1" max="5"><br><br>
        <label>Course Note</label>
        <textarea placeholder="Enter the notes" rows="4"></textarea><br><br>
        <button>Submit</button>
      </form>
    </section>
  </main>
